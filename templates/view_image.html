{% extends 'base.html' %}
{% block title %}Ver Imagen — 🐻 PhotoBearRate{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card bg-dark">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-0">{{ image.filename }}</h5>
                        <span class="badge bg-info text-dark mt-1">
                            <i class="bi bi-download me-1"></i>{{ download_count or 0 }} descargas
                        </span>
                    </div>
                    <a href="{{ url_for('admin.admin') }}#tabVotaciones" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>
                <div class="card-body text-center p-4">
                    <div style="position:relative; display:inline-block;">
                        {% if image.is_video %}
                        <video src="{{ url_for('game.serve_image', image_id=image.id) }}"
                               alt="{{ image.filename }}"
                               controls autoplay muted loop
                               style="max-height:70vh; border-radius:8px; display:block;"></video>
                        {% else %}
                        <img src="{{ url_for('game.serve_image', image_id=image.id) }}" 
                             alt="{{ image.filename }}" 
                             class="img-fluid rounded"
                             style="max-height: 70vh;">
                        {% endif %}
                        {% if is_moderator %}
                        <div class="vote-overlay" data-image-id="{{ image.id }}" data-like="{{ like_count or 0 }}" data-dislike="{{ dislike_count or 0 }}" data-user-vote="{{ user_vote or '' }}" style="position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.65); padding:5px 10px; border-radius:20px;">
                            <button type="button" class="vote-like {{ 'voted-like' if user_vote == 'like' else '' }}" onclick="voteImage({{ image.id }}, 'like');" title="Me gusta"><i class="bi bi-hand-thumbs-up"></i><span class="vote-count like-count">{{ like_count or 0 }}</span></button>
                            <button type="button" class="vote-dislike {{ 'voted-dislike' if user_vote == 'dislike' else '' }}" onclick="voteImage({{ image.id }}, 'dislike');" title="No me gusta"><i class="bi bi-hand-thumbs-down"></i><span class="vote-count dislike-count">{{ dislike_count or 0 }}</span></button>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
