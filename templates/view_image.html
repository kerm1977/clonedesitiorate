{% extends 'base.html' %}
{% block title %}Ver Imagen — 🐻 PhotoBearRate{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card bg-dark">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">{{ image.filename }}</h5>
                    <a href="{{ url_for('admin.admin') }}#tabVotaciones" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>
                <div class="card-body text-center p-4">
                    <img src="{{ url_for('game.serve_image', image_id=image.id) }}" 
                         alt="{{ image.filename }}" 
                         class="img-fluid rounded"
                         style="max-height: 70vh;">
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
