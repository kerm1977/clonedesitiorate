<div class="tab-pane fade" id="tabConocenos" role="tabpanel">
    <div class="admin-card">
        <div class="admin-card-header">
            <i class="bi bi-pencil-square me-2"></i>Editar contenido "Conózcanos"
        </div>
        <div class="admin-card-body">
            <p class="text-muted small mb-3">
                Este contenido es visible para todos los usuarios desde la barra de navegación.
                Solo el superusuario puede editarlo.
            </p>
            <form action="{{ url_for('admin.update_about') }}" method="POST" id="aboutForm">
                <div id="quillEditor" style="height: 320px;"></div>
                <input type="hidden" name="content" id="aboutHidden">
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary" onclick="flushEditor()">
                        <i class="bi bi-floppy me-1"></i>Guardar contenido
                    </button>
                    {% if about and about.content %}
                    <span class="text-muted small align-self-center">
                        <i class="bi bi-check-circle text-success me-1"></i>Contenido publicado
                    </span>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>
</div>
