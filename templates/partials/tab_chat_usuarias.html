<div class="tab-pane fade" id="tabChatUsuarias" role="tabpanel">
    <div class="card border-0 shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="bi bi-people-fill me-2"></i>Usuarias del chat</h5>
            <button class="btn btn-sm btn-success" onclick="addFakeUser()">
                <i class="bi bi-plus-lg me-1"></i>Usuaria
            </button>
        </div>
        <div class="card-body">
            <ul id="fakeUsersAdminList" class="list-group list-group-flush"></ul>
        </div>
    </div>
</div>

<script>
let _fakeUsersDefaultCatId = null;

function loadFakeUsersAdmin() {
    const container = document.getElementById('fakeUsersAdminList');
    if (!container) return;
    container.innerHTML = '<li class="list-group-item text-muted">Cargando usuarias…</li>';
    fetch('/admin/fake-users')
        .then(function(r) { return r.json(); })
        .then(function(data) { renderFakeUsersAdmin(data); })
        .catch(function() {
            container.innerHTML = '<li class="list-group-item text-danger">Error al cargar usuarias.</li>';
        });
}

function renderFakeUsersAdmin(data) {
    const container = document.getElementById('fakeUsersAdminList');
    if (!container) return;
    const users = [];
    _fakeUsersDefaultCatId = null;
    if (data && data.length) {
        _fakeUsersDefaultCatId = data[0].id;
        data.forEach(function(cat) {
            if (cat.names) {
                cat.names.forEach(function(u) { users.push(u); });
            }
        });
    }
    if (!users.length) {
        container.innerHTML = '<li class="list-group-item text-muted">No hay usuarias configuradas.</li>';
        return;
    }
    container.innerHTML = users.map(function(u) {
        return '<li class="list-group-item d-flex justify-content-between align-items-center">' +
            '<span>' + formatAtName(escapeHtml(u.name)) + '</span>' +
            '<div class="btn-group btn-group-sm">' +
                '<button class="btn btn-outline-secondary" onclick="renameFakeUser(' + u.id + ', \'' + escapeHtml(u.name).replace(/'/g, "\\'") + '\')" title="Editar"><i class="bi bi-pencil"></i></button>' +
                '<button class="btn btn-outline-danger" onclick="deleteFakeUser(' + u.id + ')" title="Borrar"><i class="bi bi-trash"></i></button>' +
            '</div>' +
        '</li>';
    }).join('');
}

function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function formatAtName(name) {
    name = String(name);
    return name.startsWith('@') ? name : '@' + name;
}

function _fakeApi(url, options) {
    return fetch(url, options).then(function(r) {
        if (!r.ok) throw new Error('Error');
        return r.json();
    }).then(function() {
        loadFakeUsersAdmin();
    }).catch(function() {
        alert('No se pudo completar la acción.');
    });
}

function addFakeUser() {
    const name = prompt('Nombre de la nueva usuaria:');
    if (!name) return;
    if (!_fakeUsersDefaultCatId) {
        alert('No hay una categoría base. Contacta al admin.');
        return;
    }
    _fakeApi('/admin/fake-users/user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category_id: _fakeUsersDefaultCatId, name: name })
    });
}

function renameFakeUser(id, current) {
    const name = prompt('Nuevo nombre de la usuaria:', current);
    if (!name || name === current) return;
    _fakeApi('/admin/fake-users/user/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
    });
}

function deleteFakeUser(id) {
    if (!confirm('¿Borrar esta usuaria?')) return;
    _fakeApi('/admin/fake-users/user/' + id, { method: 'DELETE' });
}
</script>
