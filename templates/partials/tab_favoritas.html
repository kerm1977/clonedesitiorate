<div class="tab-pane fade" id="tabFavoritas" role="tabpanel">
    <div class="admin-card mb-3">
        <div class="admin-card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-heart-fill me-2 text-danger"></i>Limpiador de Favoritas</span>
            <span id="favTotalBadge" class="badge bg-danger fs-6">—</span>
        </div>
        <div class="admin-card-body">

            <!-- Contador de imágenes eliminadas -->
            <div class="d-flex align-items-center gap-3 mb-4 p-3 rounded" style="background:#0a1a0a;border:1px solid #1d6c1d;">
                <div class="flex-fill">
                    <div class="fw-bold text-success mb-1"><i class="bi bi-trash3-fill me-1"></i>Imágenes Eliminadas</div>
                    <small class="text-muted">Total de imágenes eliminadas permanentemente.</small>
                </div>
                <span id="deletedImagesBadge" class="badge bg-success fs-6">—</span>
            </div>

            <!-- Acción global -->
            <div class="d-flex align-items-center gap-3 mb-4 p-3 rounded" style="background:#1a0a0a;border:1px solid #6c1d1d;">
                <div class="flex-fill">
                    <div class="fw-bold text-danger mb-1"><i class="bi bi-trash3-fill me-1"></i>Limpiar TODAS las favoritas</div>
                    <small class="text-muted">Elimina todos los ❤️ de todos los usuarios de una sola vez.</small>
                </div>
                <button class="btn btn-danger btn-sm px-4" onclick="clearAllFavs()">
                    <i class="bi bi-trash3"></i> Limpiar todo
                </button>
            </div>

            <!-- Lista por sesión -->
            <div class="fw-semibold mb-2 text-muted small"><i class="bi bi-person-lines-fill me-1"></i>Por usuario / sesión</div>
            <div id="favSessionList">
                <div class="text-center text-muted py-3"><i class="bi bi-arrow-repeat spin me-1"></i>Cargando...</div>
            </div>
        </div>
    </div>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin 1s linear infinite; }
</style>

<script>
let _favStatsLoaded = false;

function loadFavStats() {
    if (_favStatsLoaded) return;
    fetch('/admin/favorites/stats')
        .then(r => r.json())
        .then(d => {
            _favStatsLoaded = false; // permitir refrescar
            document.getElementById('favTotalBadge').textContent = d.total + ' ❤️';
            const list = document.getElementById('favSessionList');
            if (!d.by_session.length) {
                list.innerHTML = '<div class="text-center text-muted py-3">No hay favoritas registradas.</div>';
                return;
            }
            list.innerHTML = `
                <table class="table table-dark table-sm align-middle">
                    <thead><tr>
                        <th>Sesión</th>
                        <th class="text-center">Favoritas</th>
                        <th class="text-end">Acción</th>
                    </tr></thead>
                    <tbody>
                        ${d.by_session.map(s => `
                        <tr id="favrow-${CSS.escape(s.session)}">
                            <td><code style="font-size:.75rem;">${s.session.substring(0,20)}…</code></td>
                            <td class="text-center"><span class="badge bg-danger">${s.count} ❤️</span></td>
                            <td class="text-end">
                                <button class="btn btn-outline-danger btn-sm" onclick="clearSessionFavs('${s.session}', this)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>`;
        })
        .catch(() => {
            document.getElementById('favSessionList').innerHTML = '<div class="text-danger">Error al cargar.</div>';
        });
    
    // Cargar contador de imágenes eliminadas
    fetch('/admin/deleted-images/count')
        .then(r => r.json())
        .then(d => {
            document.getElementById('deletedImagesBadge').textContent = d.user_deleted + ' 🗑️';
        })
        .catch(() => {
            document.getElementById('deletedImagesBadge').textContent = 'Error';
        });
}

function clearAllFavs() {
    if (!confirm('¿Eliminar TODAS las favoritas de TODOS los usuarios? Acción irreversible.')) return;
    fetch('/admin/favorites/clear-all', { method: 'POST' })
        .then(r => r.json())
        .then(d => {
            if (d.success) {
                document.getElementById('favTotalBadge').textContent = '0 ❤️';
                document.getElementById('favSessionList').innerHTML = '<div class="text-center text-muted py-3">No hay favoritas registradas.</div>';
                _favStatsLoaded = false;
            }
        });
}

function clearSessionFavs(uid, btn) {
    if (!confirm('¿Eliminar todas las favoritas de esta sesión?')) return;
    btn.disabled = true;
    fetch('/admin/favorites/clear-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: uid })
    })
    .then(r => r.json())
    .then(d => {
        if (d.success) {
            const row = document.getElementById('favrow-' + CSS.escape(uid));
            if (row) { row.style.transition = 'opacity .25s'; row.style.opacity = '0'; setTimeout(() => row.remove(), 260); }
            // actualizar total
            _favStatsLoaded = false;
            loadFavStats();
        } else { btn.disabled = false; }
    })
    .catch(() => { btn.disabled = false; });
}
</script>
