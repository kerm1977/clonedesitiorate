<div class="tab-pane fade" id="tabFeedback" role="tabpanel">
    <div class="admin-card">
        <div class="admin-card-header">
            <i class="bi bi-chat-dots me-2"></i>Comentarios de usuarios
            <span class="badge bg-secondary ms-2">{{ feedbacks|length }}</span>
        </div>
        <div class="admin-card-body">
            {% if feedbacks %}
            {% for fb in feedbacks %}
            <div class="feedback-item mb-3 pb-3 border-bottom border-secondary">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="badge bg-dark border border-secondary font-monospace small">
                        {{ fb.user_session[:8] }}…
                    </span>
                    <small class="text-muted">{{ fb.created_at.strftime('%d/%m/%Y %H:%M') }}</small>
                </div>
                <p class="mb-0">{{ fb.comment }}</p>
            </div>
            {% endfor %}
            {% else %}
            <div class="text-center text-muted py-4">
                <i class="bi bi-envelope-open display-6 d-block mb-2"></i>
                No hay comentarios aún.
            </div>
            {% endif %}
        </div>
    </div>
</div>
